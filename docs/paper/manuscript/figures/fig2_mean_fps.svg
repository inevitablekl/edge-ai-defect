<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <title>Mean Frame-Rate Comparison of V0, V2R, and V3R</title>
  <desc>Three mean FPS bars with frozen sample-standard-deviation error bars.</desc>
  <style>
    text { font-family: sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 700; }
    .axis-label { font-size: 17px; font-weight: 600; }
    .tick { font-size: 14px; }
    .value { font-size: 13px; font-weight: 600; }
    .legend { font-size: 14px; }
    .axis { stroke: #374151; stroke-width: 1.5; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .error { stroke: #111827; stroke-width: 2; }
  </style>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" class="title">V0、V2R和V3R平均帧率比较</text>
  <line x1="105" y1="95" x2="105" y2="510" class="axis"/>
  <line x1="105" y1="510" x2="900" y2="510" class="axis"/>
  <line x1="105" y1="510.000" x2="900" y2="510.000" class="grid"/>
  <text x="92" y="515.000" text-anchor="end" class="tick">0</text>
  <line x1="105" y1="450.714" x2="900" y2="450.714" class="grid"/>
  <text x="92" y="455.714" text-anchor="end" class="tick">20</text>
  <line x1="105" y1="391.429" x2="900" y2="391.429" class="grid"/>
  <text x="92" y="396.429" text-anchor="end" class="tick">40</text>
  <line x1="105" y1="332.143" x2="900" y2="332.143" class="grid"/>
  <text x="92" y="337.143" text-anchor="end" class="tick">60</text>
  <line x1="105" y1="272.857" x2="900" y2="272.857" class="grid"/>
  <text x="92" y="277.857" text-anchor="end" class="tick">80</text>
  <line x1="105" y1="213.571" x2="900" y2="213.571" class="grid"/>
  <text x="92" y="218.571" text-anchor="end" class="tick">100</text>
  <line x1="105" y1="154.286" x2="900" y2="154.286" class="grid"/>
  <text x="92" y="159.286" text-anchor="end" class="tick">120</text>
  <line x1="105" y1="95.000" x2="900" y2="95.000" class="grid"/>
  <text x="92" y="100.000" text-anchor="end" class="tick">140</text>
  <rect class="bar fps-bar" data-metric-id="M_R_V0_FPS" x="195.000" y="348.150" width="130" height="161.850" fill="#64748b"/>
  <g class="error-bar" data-metric-id="M_R_V0_FPS_SD">
    <line x1="260.000" y1="347.488" x2="260.000" y2="348.812" class="error"/>
    <line x1="242.000" y1="347.488" x2="278.000" y2="347.488" class="error"/>
    <line x1="242.000" y1="348.812" x2="278.000" y2="348.812" class="error"/>
  </g>
  <text x="260.000" y="337.488" text-anchor="middle" class="value">54.600 ± 0.223</text>
  <text x="260.000" y="538" text-anchor="middle" class="axis-label">V0</text>
  <rect class="bar fps-bar" data-metric-id="M_R_V2R_FPS" x="435.000" y="147.995" width="130" height="362.005" fill="#0f766e"/>
  <g class="error-bar" data-metric-id="M_R_V2R_FPS_SD">
    <line x1="500.000" y1="146.537" x2="500.000" y2="149.453" class="error"/>
    <line x1="482.000" y1="146.537" x2="518.000" y2="146.537" class="error"/>
    <line x1="482.000" y1="149.453" x2="518.000" y2="149.453" class="error"/>
  </g>
  <text x="500.000" y="136.537" text-anchor="middle" class="value">122.122 ± 0.492</text>
  <text x="500.000" y="538" text-anchor="middle" class="axis-label">V2R</text>
  <rect class="bar fps-bar" data-metric-id="M_R_V3R_FPS" x="675.000" y="133.247" width="130" height="376.753" fill="#d97706"/>
  <g class="error-bar" data-metric-id="M_R_V3R_FPS_SD">
    <line x1="740.000" y1="129.455" x2="740.000" y2="137.039" class="error"/>
    <line x1="722.000" y1="129.455" x2="758.000" y2="129.455" class="error"/>
    <line x1="722.000" y1="137.039" x2="758.000" y2="137.039" class="error"/>
  </g>
  <text x="740.000" y="119.455" text-anchor="middle" class="value">127.097 ± 1.279</text>
  <text x="740.000" y="538" text-anchor="middle" class="axis-label">V3R</text>
  <text x="28" y="300" text-anchor="middle" class="axis-label" transform="rotate(-90 28 300)">平均帧率/FPS</text>
  <text x="480" y="585" text-anchor="middle" class="legend">误差棒：5次运行FPS的冻结样本标准差</text>
</svg>
