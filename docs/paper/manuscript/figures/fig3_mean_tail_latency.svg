<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <title>Mean and Tail Latency Comparison of V0, V2R, and V3R</title>
  <desc>Grouped bars for nine distinct frozen mean, P95, and P99 latency metrics.</desc>
  <style>
    text { font-family: sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 700; }
    .axis-label { font-size: 17px; font-weight: 600; }
    .tick { font-size: 14px; }
    .value { font-size: 13px; font-weight: 600; }
    .legend { font-size: 14px; }
    .axis { stroke: #374151; stroke-width: 1.5; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .error { stroke: #111827; stroke-width: 2; }
  </style>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" class="title">V0、V2R和V3R平均及尾延迟比较</text>
  <line x1="105" y1="95" x2="105" y2="510" class="axis"/>
  <line x1="105" y1="510" x2="900" y2="510" class="axis"/>
  <line x1="105" y1="510.000" x2="900" y2="510.000" class="grid"/>
  <text x="92" y="515.000" text-anchor="end" class="tick">0</text>
  <line x1="105" y1="415.682" x2="900" y2="415.682" class="grid"/>
  <text x="92" y="420.682" text-anchor="end" class="tick">5</text>
  <line x1="105" y1="321.364" x2="900" y2="321.364" class="grid"/>
  <text x="92" y="326.364" text-anchor="end" class="tick">10</text>
  <line x1="105" y1="227.045" x2="900" y2="227.045" class="grid"/>
  <text x="92" y="232.045" text-anchor="end" class="tick">15</text>
  <line x1="105" y1="132.727" x2="900" y2="132.727" class="grid"/>
  <text x="92" y="137.727" text-anchor="end" class="tick">20</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V0_LAT_MEAN" data-statistic="mean" x="166.000" y="165.305" width="56" height="344.695" fill="#2563eb"/>
  <text x="194.000" y="157.305" text-anchor="middle" class="value">18.273</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V0_P95" data-statistic="P95" x="232.000" y="154.343" width="56" height="355.657" fill="#0f766e"/>
  <text x="260.000" y="146.343" text-anchor="middle" class="value">18.854</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V0_P99" data-statistic="P99" x="298.000" y="150.302" width="56" height="359.698" fill="#d97706"/>
  <text x="326.000" y="142.302" text-anchor="middle" class="value">19.068</text>
  <text x="260.000" y="538" text-anchor="middle" class="axis-label">V0</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V2R_LAT_MEAN" data-statistic="mean" x="406.000" y="356.445" width="56" height="153.555" fill="#2563eb"/>
  <text x="434.000" y="348.445" text-anchor="middle" class="value">8.140</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V2R_P95" data-statistic="P95" x="472.000" y="324.625" width="56" height="185.375" fill="#0f766e"/>
  <text x="500.000" y="316.625" text-anchor="middle" class="value">9.827</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V2R_P99" data-statistic="P99" x="538.000" y="292.521" width="56" height="217.479" fill="#d97706"/>
  <text x="566.000" y="284.521" text-anchor="middle" class="value">11.529</text>
  <text x="500.000" y="538" text-anchor="middle" class="axis-label">V2R</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V3R_LAT_MEAN" data-statistic="mean" x="646.000" y="362.641" width="56" height="147.359" fill="#2563eb"/>
  <text x="674.000" y="354.641" text-anchor="middle" class="value">7.812</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V3R_P95" data-statistic="P95" x="712.000" y="324.344" width="56" height="185.656" fill="#0f766e"/>
  <text x="740.000" y="316.344" text-anchor="middle" class="value">9.842</text>
  <rect class="bar latency-bar" data-metric-id="M_R_V3R_P99" data-statistic="P99" x="778.000" y="292.779" width="56" height="217.221" fill="#d97706"/>
  <text x="806.000" y="284.779" text-anchor="middle" class="value">11.515</text>
  <text x="740.000" y="538" text-anchor="middle" class="axis-label">V3R</text>
  <rect x="345" y="566" width="22" height="14" fill="#2563eb"/>
  <text x="375" y="579" class="legend">均值</text>
  <rect x="465" y="566" width="22" height="14" fill="#0f766e"/>
  <text x="495" y="579" class="legend">P95</text>
  <rect x="575" y="566" width="22" height="14" fill="#d97706"/>
  <text x="605" y="579" class="legend">P99</text>
  <text x="28" y="300" text-anchor="middle" class="axis-label" transform="rotate(-90 28 300)">延迟/ms</text>
</svg>
