<rect x="1390" y="288" width="145" height="100" rx="10" fill="#e8edf2" stroke="#38434d" stroke-width="3"/>
<text x="1462" y="348" text-anchor="middle" font-family="Liberation Mono,monospace" font-size="27" font-weight="700" fill="#20252b">enqueueV3</text>
<path d="M500,145 L1515,145" fill="none" stroke="#315c76" stroke-width="7"/>
<text x="1008" y="127" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="28" font-weight="700" fill="#315c76">同一 TensorRT CUDA stream（单帧顺序）</text>
<line x1="520" y1="145" x2="520" y2="284" stroke="#315c76" stroke-width="4" marker-end="url(#stream-arrow)"/>
<line x1="950" y1="145" x2="950" y2="258" stroke="#315c76" stroke-width="4" marker-end="url(#stream-arrow)"/>
<path d="M1515,145 L1540,145 L1540,338" fill="none" stroke="#315c76" stroke-width="4" marker-end="url(#stream-arrow)"/>
<text x="800" y="505" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="700" fill="#4b5563">V2R / V3R仅主机暂存分配类型不同；无跨帧重叠</text>
</svg>
