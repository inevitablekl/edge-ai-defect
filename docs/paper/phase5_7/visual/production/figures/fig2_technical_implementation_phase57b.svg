<text x="692" y="331" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="400" fill="#20252b">device raw</text>
<text x="692" y="365" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="400" fill="#20252b">buffer</text>
<line x1="785" y1="338" x2="830" y2="338" stroke="#38434d" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="840" y="268" width="220" height="140" rx="10" fill="#e6f1e8" stroke="#38434d" stroke-width="3"/>
<text x="950" y="331" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="700" fill="#20252b">fused CUDA</text>
<text x="950" y="365" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="700" fill="#20252b">preprocessing</text>
<line x1="1060" y1="338" x2="1105" y2="338" stroke="#38434d" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1115" y="268" width="255" height="140" rx="10" fill="#ffffff" stroke="#38434d" stroke-width="3"/>
<text x="1242" y="314" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="400" fill="#20252b">TensorRT-owned</text>
<text x="1242" y="348" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="400" fill="#20252b">FP32 NCHW</text>
