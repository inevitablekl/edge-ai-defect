<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="62mm" viewBox="0 0 1600 620" role="img">
<title>V2R/V3R host-device input path</title>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#38434d"/></marker>
<marker id="stream-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#315c76"/></marker>
</defs>
<rect width="1600" height="620" fill="#ffffff"/>
<rect x="45" y="45" width="405" height="500" rx="12" fill="#f5f6f7" stroke="#38434d" stroke-width="3"/>
<rect x="495" y="45" width="1060" height="500" rx="12" fill="#eef4f8" stroke="#38434d" stroke-width="3"/>
<text x="248" y="88" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="31" font-weight="700" fill="#20252b">主机 / CPU</text>
<text x="1025" y="88" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="31" font-weight="700" fill="#20252b">设备 / GPU</text>
<line x1="473" y1="58" x2="473" y2="532" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="95" y="135" width="305" height="88" rx="10" fill="#ffffff" stroke="#38434d" stroke-width="3"/>
<text x="247" y="189" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="400" fill="#20252b">Decoded CV_8UC3 BGR</text>
<line x1="248" y1="223" x2="248" y2="268" stroke="#38434d" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="95" y="278" width="305" height="120" rx="10" fill="#f3e8dc" stroke="#38434d" stroke-width="3"/>
<text x="247" y="314" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="400" fill="#20252b">Pageable / pinned</text>
<text x="247" y="348" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="27" font-weight="400" fill="#20252b">packed staging</text>
