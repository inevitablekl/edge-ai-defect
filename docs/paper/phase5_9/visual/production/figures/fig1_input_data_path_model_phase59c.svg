<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="79mm" viewBox="0 0 1600 790" role="img">
<title>输入数据路径抽象及层级受控比较</title>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#38434d"/></marker>
<marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#315c76"/></marker>
</defs>
<rect width="1600" height="790" fill="#ffffff"/>
<rect x="170" y="78" width="585" height="540" rx="12" fill="#f5f6f7" stroke="#38434d" stroke-width="3"/>
<rect x="845" y="78" width="585" height="540" rx="12" fill="#eef4f8" stroke="#38434d" stroke-width="3"/>
<text x="462" y="116" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="30" font-weight="700" fill="#20252b">主机域</text>
<text x="1137" y="116" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="30" font-weight="700" fill="#20252b">设备域</text>
<line x1="800" y1="82" x2="800" y2="614" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/>
<text x="800" y="70" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="23" font-weight="400" fill="#5f6973">主机—设备边界</text>
<rect x="28" y="170" width="118" height="92" rx="10" fill="#e4e7ea" stroke="#38434d" stroke-width="3"/>
<text x="87" y="225" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">P₀ / V0</text>
<rect x="220" y="160" width="450" height="112" rx="10" fill="#e4e7ea" stroke="#38434d" stroke-width="3"/>
<text x="445" y="210" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">CPU输入形成</text>
<text x="445" y="241" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">FP32 NCHW</text>
<text x="445" y="299" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="23" font-weight="400" fill="#4b5563">M = 无</text>
<line x1="670" y1="216" x2="885" y2="216" stroke="#38434d" stroke-width="4" marker-end="url(#arrow)"/>
<text x="777" y="198" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="22" font-weight="700" fill="#315c76">R = FP32 NCHW</text>
<rect x="900" y="160" width="430" height="112" rx="10" fill="#ffffff" stroke="#38434d" stroke-width="3"/>
<text x="1115" y="210" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">TensorRT输入</text>
<text x="1115" y="241" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">F = 主机</text>
<rect x="1345" y="170" width="225" height="92" rx="10" fill="#faf7ea" stroke="#38434d" stroke-width="3"/>
<text x="1457" y="225" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="22" font-weight="400" fill="#20252b">E = 单帧顺序</text>
<rect x="28" y="325" width="118" height="92" rx="10" fill="#d8eaf5" stroke="#38434d" stroke-width="3"/>
<text x="87" y="380" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">P₂ / V2R</text>
<rect x="220" y="315" width="450" height="112" rx="10" fill="#d8eaf5" stroke="#38434d" stroke-width="3"/>
<text x="445" y="365" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">Pageable暂存</text>
<text x="445" y="396" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">packed BGR uint8</text>
<text x="445" y="454" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="23" font-weight="400" fill="#4b5563">M = Pageable</text>
<line x1="670" y1="371" x2="885" y2="371" stroke="#38434d" stroke-width="4" marker-end="url(#arrow)"/>
<text x="777" y="353" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="22" font-weight="700" fill="#315c76">R = packed BGR uint8</text>
<rect x="900" y="315" width="430" height="112" rx="10" fill="#ffffff" stroke="#38434d" stroke-width="3"/>
<text x="1115" y="365" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">GPU融合输入形成</text>
<text x="1115" y="396" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">F = 设备</text>
<rect x="1345" y="325" width="225" height="92" rx="10" fill="#faf7ea" stroke="#38434d" stroke-width="3"/>
<text x="1457" y="380" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="22" font-weight="400" fill="#20252b">E = 单帧顺序</text>
<rect x="28" y="480" width="118" height="92" rx="10" fill="#f4dfcb" stroke="#38434d" stroke-width="3"/>
<text x="87" y="535" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">P₃ / V3R</text>
<rect x="220" y="470" width="450" height="112" rx="10" fill="#f4dfcb" stroke="#38434d" stroke-width="3"/>
<text x="445" y="520" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">Pinned暂存</text>
<text x="445" y="551" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">packed BGR uint8</text>
<text x="445" y="609" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="23" font-weight="400" fill="#4b5563">M = Pinned</text>
<line x1="670" y1="526" x2="885" y2="526" stroke="#38434d" stroke-width="4" marker-end="url(#arrow)"/>
<text x="777" y="508" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="22" font-weight="700" fill="#315c76">R = packed BGR uint8</text>
<rect x="900" y="470" width="430" height="112" rx="10" fill="#ffffff" stroke="#38434d" stroke-width="3"/>
<text x="1115" y="520" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">GPU融合输入形成</text>
<text x="1115" y="551" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="25" font-weight="700" fill="#20252b">F = 设备</text>
<rect x="1345" y="480" width="225" height="92" rx="10" fill="#faf7ea" stroke="#38434d" stroke-width="3"/>
<text x="1457" y="535" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="22" font-weight="400" fill="#20252b">E = 单帧顺序</text>
<path d="M88,272 L88,320" fill="none" stroke="#315c76" stroke-width="5" marker-end="url(#blue-arrow)"/>
<rect x="170" y="638" width="585" height="100" rx="10" fill="#e8f1f7" stroke="#315c76" stroke-width="3"/>
<text x="462" y="682" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="24" font-weight="700" fill="#20252b">P₀ → P₂：路径级重构</text>
<text x="462" y="713" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="24" font-weight="700" fill="#20252b">改变 R、F、M；E 保持不变</text>
<path d="M88,427 L88,475" fill="none" stroke="#8a5a35" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="845" y="638" width="585" height="100" rx="10" fill="#f8eadf" stroke="#8a5a35" stroke-width="3"/>
<text x="1137" y="682" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="24" font-weight="700" fill="#20252b">P₂ → P₃：暂存策略级细化</text>
<text x="1137" y="713" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="24" font-weight="700" fill="#20252b">仅改变 M：Pageable → Pinned</text>
<text x="800" y="774" text-anchor="middle" font-family="Noto Serif CJK SC,Liberation Serif,serif" font-size="22" font-weight="400" fill="#5f6973">干预层级表示结构变量范围，不表示收益大小或组件级因果关系</text>
</svg>
